<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makmoura Family Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --navy:#0B1A32; --gold:#ECAC4E; --gold-deep:#9A6412; --gold-soft:#FDEFD6; --gold-mist:#FFF8EC;
  --bg:#FBF7F0; --surface:#FFFFFF; --ink:#0B1A32; --ink-2:#55607A; --ink-3:#98A0B0; --line:rgba(11,26,50,.07);
  --green:#2E9E6E; --green-soft:#E3F5EC;
  --f-display:"Baloo Bhaijaan 2", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body:"IBM Plex Sans Arabic", system-ui, sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.22,1,.36,1);
  --sh-1:0 1px 2px rgba(11,26,50,.04), 0 6px 20px rgba(11,26,50,.06);
  --sh-2:0 2px 4px rgba(11,26,50,.05), 0 16px 40px rgba(11,26,50,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#EDE6DA;color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;padding-inline:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
img{max-width:100%;display:block}
svg.i{width:1em;height:1em;flex:none}
.d{font-family:var(--f-display)}

/* ================= Presenter (outside the phone) ================= */
.stage{min-height:100%;display:flex;justify-content:center;align-items:center;gap:56px;padding-block:28px}
.presenter{width:320px;display:flex;flex-direction:column;gap:20px}
.logo{display:flex;align-items:center;gap:12px}
.logo .mk{width:48px;height:48px}
.logo b{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.logo span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(11,26,50,.07);padding:5px;border-radius:18px}
.who button{height:48px;border-radius:14px;font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--ink-2)}
.who button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.kidpick{display:flex;gap:10px}
.kidpick button{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:99px;background:rgba(255,255,255,.55);font-weight:500;font-size:14px}
.kidpick button[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--navy)}
.kidpick .av{width:30px;height:30px;font-size:14px}
.explain{background:var(--surface);border-radius:20px;padding:18px;font-size:15px;line-height:1.8;box-shadow:var(--sh-1)}
.explain b{font-family:var(--f-display);font-size:18px;display:block;margin-bottom:4px}
.try{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.try li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2);line-height:1.5}
.try li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;padding-top:2px}
.try-h{font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:-8px}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.6);font-size:13px;font-weight:500}
.chip img{width:22px;height:22px}
.chip[aria-pressed="true"]{background:var(--gold);}

/* ================= Phone ================= */
.phone{width:390px;height:min(844px, calc(100dvh - 56px));min-height:660px;border-radius:54px;background:var(--bg);position:relative;overflow:hidden;
  box-shadow:0 0 0 11px #0B1A32, 0 0 0 12px #34435f, 0 40px 90px rgba(11,26,50,.30);flex:none}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:58px 20px 40px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;gap:22px}

.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;flex:none;background:linear-gradient(145deg,var(--c1),var(--c2));padding-top:.12em}
.av img{width:100%;height:100%;object-fit:cover;padding:0}

/* ---------- child top bar ---------- */
.top{display:flex;align-items:center;gap:12px}
.top .av{width:58px;height:58px;font-size:26px;box-shadow:0 0 0 3px #fff, 0 4px 14px rgba(11,26,50,.14)}
.top h1{margin:0;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1;flex:1}
.top h1 small{display:block;font-size:15px;font-weight:500;color:var(--ink-3)}
.fam{display:flex;align-items:center;gap:6px;height:52px;padding:0 9px;border-radius:99px;background:var(--surface);box-shadow:var(--sh-1)}
.fam .faces{display:flex}
.fam .faces .av{width:34px;height:34px;font-size:15px;box-shadow:0 0 0 2px #fff}
.fam .faces .av+.av{margin-inline-start:-12px}

/* ---------- Makmoura (the jar) ---------- */
.mk-card{position:relative;width:100%;display:grid;grid-template-columns:150px 1fr;align-items:center;gap:8px;padding:18px 18px 18px 14px;border-radius:34px;text-align:start;overflow:hidden;
  background:radial-gradient(90% 120% at 85% 20%, #FFF6E4 0%, #FFFFFF 70%);box-shadow:var(--sh-2), inset 0 0 0 1px rgba(236,172,78,.22);transition:transform .2s var(--out)}
.mk-card:active{transform:scale(.98)}
.jar{width:150px;height:180px;display:block;overflow:visible}
.jar .coins{transition:transform 1.2s var(--out)}
.jar-num{font-family:var(--f-display);font-weight:800}
.goal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.goal .pic{width:108px;height:108px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px var(--gold-soft), var(--sh-1);position:relative}
.goal .pic img{width:78px;height:78px}
.goal .pic .star{position:absolute;top:-6px;left:-4px;width:34px;height:34px;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(12deg)}}
.goal b{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:6px;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:2px 12px 0;border-radius:99px;background:var(--gold-soft);color:var(--gold-deep);font-family:var(--f-display);font-weight:700;font-size:16px}
.pill .coin{width:20px;height:20px;margin-top:-2px}
.arrow{position:absolute;top:50%;right:148px;width:26px;height:26px;margin-top:-13px;color:var(--gold);opacity:.8}

/* ---------- tasks ---------- */
.h2{display:flex;align-items:center;justify-content:space-between}
.h2 h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700}
.count{display:flex;gap:5px}
.count i{width:10px;height:10px;border-radius:50%;background:rgba(11,26,50,.1);transition:background .3s}
.count i.on{background:var(--green)}
.count i.wait{background:var(--gold)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.task{position:relative;height:156px;border-radius:28px;background:var(--surface);box-shadow:var(--sh-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .2s var(--out), background .3s, box-shadow .3s}
.task:active{transform:scale(.94)}
.task .art{width:84px;height:84px;transition:transform .45s var(--spring), filter .3s, opacity .3s}
.task .lb{font-family:var(--f-display);font-size:20px;font-weight:600}
.task .st{position:absolute;top:10px;right:10px;width:38px;height:38px}
.task.wide{grid-column:1 / -1;height:112px;flex-direction:row;gap:18px}
.task.wait{background:var(--gold-mist);box-shadow:inset 0 0 0 2.5px var(--gold)}
.task.wait .st{animation:flip 2.6s ease-in-out infinite}
@keyframes flip{0%,70%{transform:rotate(0)}85%,100%{transform:rotate(180deg)}}
.task.done{background:#F6F3EE;box-shadow:none}
.task.done .art{filter:saturate(.35);opacity:.55;transform:scale(.88)}
.task.done .lb{color:var(--ink-3)}
.task.pop .art{animation:pop .55s var(--spring)}
.task.pop .st{animation:pin .5s var(--spring)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.75) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes pin{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}

/* ---------- family reward ---------- */
.fr{position:relative;border-radius:34px;padding:26px 20px 22px;text-align:center;overflow:hidden;background:linear-gradient(180deg,#FFF1D6 0%,#FFF9EF 55%,#fff 100%);box-shadow:var(--sh-2), inset 0 0 0 1px rgba(236,172,78,.3)}
.fr .glow{position:relative;margin:0 auto;width:150px;height:150px;display:grid;place-items:center}
.fr .glow::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,#FFE2A8 0%,rgba(255,226,168,0) 70%)}
.fr .glow img{position:relative;width:124px;height:124px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.fr .pp{position:absolute;width:44px;height:44px}
.fr .pp.a{top:18px;right:22px;transform:scaleX(-1)}
.fr .pp.b{top:18px;left:22px}
.fr .ey{font-family:var(--f-display);font-weight:800;font-size:26px;margin-top:4px;line-height:1.2}
.fr .why{font-size:15px;color:var(--ink-2);margin-top:4px;line-height:1.7}
.fr .what{display:inline-block;margin-top:14px;padding:10px 20px 6px;border-radius:18px;background:#fff;box-shadow:var(--sh-1);font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.35}
.fr .us{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:17px}
.fr .us .faces{display:flex}
.fr .us .av{width:36px;height:36px;font-size:15px;box-shadow:0 0 0 2.5px #fff}
.fr .us .av+.av{margin-inline-start:-11px}
.fr .done-btn{margin-top:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:2px 24px 0;border-radius:99px;font-family:var(--f-display);font-weight:700;font-size:18px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn .i{font-size:20px;margin-top:-2px}
.btn.navy{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.soft{background:rgba(11,26,50,.06)}
.btn.block{width:100%}

/* ---------- parent ---------- */
.ph h1{margin:0;font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.15}
.ph small{font-size:14px;color:var(--ink-3)}
.kids{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface);border-radius:30px;padding:20px 8px 16px;box-shadow:var(--sh-1)}
.kid{display:flex;flex-direction:column;align-items:center;gap:4px}
.kid .rg{position:relative;width:80px;height:80px}
.kid .rg .av{position:absolute;inset:9px;font-size:26px}
.kid .rg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.kid b{font-family:var(--f-display);font-size:18px;font-weight:700;margin-top:4px}
.kid span{font-size:13px;color:var(--ink-3)}
.kid span.full{color:var(--green);font-weight:600}
.appr{background:var(--surface);border-radius:30px;padding:20px;box-shadow:var(--sh-2)}
.appr .hd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.appr .hd h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;flex:1}
.appr .hd .n{min-width:32px;height:32px;border-radius:99px;background:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;padding-top:2px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row .art{width:52px;height:52px;border-radius:16px;background:#F7F3EC;display:grid;place-items:center;flex:none}
.row .art img{width:40px;height:40px}
.row .tx{flex:1;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.row .tx .av{width:28px;height:28px;font-size:13px}
.row .tx span{color:var(--ink-2);font-weight:400}
.ok{width:52px;height:52px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:26px;transition:transform .2s var(--spring)}
.ok:active{transform:scale(.85);background:var(--green);color:#fff}
.appr .btn{margin-top:10px}
.calm{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:30px;padding:18px 20px;box-shadow:var(--sh-1)}
.calm img{width:52px;height:52px}
.calm b{font-family:var(--f-display);font-size:20px;display:block}
.calm span{font-size:14px;color:var(--ink-3)}
.gift-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:26px;background:var(--surface);box-shadow:var(--sh-1);text-align:start}
.gift-row img{width:56px;height:56px}
.gift-row b{font-family:var(--f-display);font-size:19px;font-weight:700;display:block}
.gift-row span{font-size:13px;color:var(--ink-3)}
.gift-row .t{flex:1}
.gift-row .go{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center;font-size:18px}

/* ---------- sheets / overlays ---------- */
.scrim{position:absolute;inset:0;background:rgba(11,26,50,.32);opacity:0;transition:opacity .3s;z-index:20}
.scrim.show{opacity:1}
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:34px 34px 0 0;padding:10px 20px 34px;z-index:21;transform:translateY(100%);transition:transform .45s var(--out);scrollbar-width:none}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:99px;background:rgba(11,26,50,.16);margin:0 auto 10px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sh h2{margin:0;font-family:var(--f-display);font-size:26px;font-weight:800}
.x{width:40px;height:40px;border-radius:50%;background:rgba(11,26,50,.07);display:grid;place-items:center;font-size:20px}
.gsheet{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.gsheet .big{width:150px;height:150px}
.gsheet h3{margin:0;font-family:var(--f-display);font-size:30px;font-weight:800}
.gsheet .nums{font-family:var(--f-display);font-size:20px;color:var(--ink-2)}
.gsheet .nums b{font-size:34px;color:var(--ink);font-weight:800}
.bar{width:100%;height:16px;border-radius:99px;background:rgba(11,26,50,.07);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(270deg,#F7CE84,var(--gold));margin-inline-start:0}
.days{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:18px;text-align:start}
.days .dh{font-family:var(--f-display);font-weight:700;font-size:18px}
.day{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:10px 14px;font-size:15px}
.day b{font-family:var(--f-display);font-weight:600;min-width:62px}
.day .ic{display:flex;gap:2px;flex:1}
.day .ic img{width:24px;height:24px}
.day .ic img.no{opacity:.25;filter:grayscale(1)}
.day .earn{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;color:var(--gold-deep)}
.day .earn .coin{width:18px;height:18px}
.day.moment{background:var(--gold-mist);box-shadow:inset 0 0 0 1px rgba(236,172,78,.35)}
.day.moment .ic{align-items:center;gap:8px;font-weight:500}
.day.moment .ic img{width:30px;height:30px}

.together{background:var(--surface);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh-1)}
.together .t{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-display);font-size:19px;font-weight:700}
.together .t span{font-size:16px;color:var(--ink-2);font-weight:600}
.together .bar{margin:0}
.teaser{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:var(--gold-mist);box-shadow:inset 0 0 0 1px rgba(236,172,78,.35);font-size:15px;font-weight:500;line-height:1.5;margin-top:12px}
.teaser img{width:48px;height:48px;animation:wig 3s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-5deg)}}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -20px 0;padding:4px 20px 12px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.sib{flex:0 0 80%;scroll-snap-align:center;background:var(--surface);border-radius:30px;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--sh-1)}
.sib .av{width:96px;height:96px;font-size:40px;box-shadow:0 0 0 4px #fff, 0 0 0 7px var(--ring,var(--gold-soft))}
.sib h4{margin:6px 0 0;font-family:var(--f-display);font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px}
.sib h4 em{font-style:normal;font-size:13px;background:var(--navy);color:#fff;border-radius:99px;padding:3px 10px 1px}
.sib .ics{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.sib .ics span{position:relative;width:44px;height:44px;border-radius:14px;background:#F7F3EC;display:grid;place-items:center}
.sib .ics img{width:32px;height:32px}
.sib .ics .todo img{opacity:.3;filter:grayscale(1)}
.sib .ics .ok2{position:absolute;bottom:-4px;left:-4px;width:20px;height:20px}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(11,26,50,.15);transition:width .3s}
.dots i.on{width:20px;background:var(--navy)}

.step{font-family:var(--f-display);font-weight:700;font-size:19px;margin:4px 0 10px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.ro{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 10px;border-radius:22px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);transition:box-shadow .2s}
.ro img{width:54px;height:54px;transition:transform .3s var(--spring)}
.ro[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--navy);color:var(--ink)}
.ro[aria-pressed="true"] img{transform:scale(1.1)}
.co{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;background:var(--surface);text-align:start;margin-bottom:8px;font-size:16px;font-weight:500}
.co img{width:40px;height:40px}
.co .t{flex:1}
.co .r{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(11,26,50,.2)}
.co[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--navy)}
.co[aria-pressed="true"] .r{box-shadow:inset 0 0 0 7px var(--navy)}
.extra{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0 14px}
.extra .sb{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-1);font-size:22px;font-weight:700}
.extra .v{font-family:var(--f-display);font-size:30px;font-weight:800;min-width:50px;text-align:center}
.extra .tp{width:52px;height:52px;border-radius:16px;background:var(--surface);display:grid;place-items:center}
.extra .tp img{width:36px;height:36px}
.extra .tp[aria-pressed="false"] img{opacity:.3;filter:grayscale(1)}
.extra .tp[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--navy)}
.extra.wrap{flex-wrap:wrap;gap:8px}

.reveal{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(110% 70% at 50% 35%, #FFE9BF 0%, #FFF6E6 55%, #FBF7F0 100%);opacity:0;transition:opacity .35s}
.reveal.show{opacity:1}
.reveal .in{display:flex;flex-direction:column;align-items:center;transform:scale(.8) translateY(20px);transition:transform .7s var(--spring)}
.reveal.show .in{transform:none}
.reveal .hero{width:210px;height:210px;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 20px 24px rgba(201,138,46,.35))}
.reveal .ey{font-family:var(--f-display);font-weight:800;font-size:36px;margin-top:16px;line-height:1.2}
.reveal .why{font-size:17px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.reveal .what{margin-top:18px;padding:12px 24px 8px;border-radius:22px;background:#fff;box-shadow:var(--sh-2);font-family:var(--f-display);font-size:26px;font-weight:700}
.reveal .btn{margin-top:34px;height:66px;padding:2px 40px 0;font-size:22px}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.toast{position:absolute;top:60px;left:50%;transform:translate(-50%,-16px);background:var(--navy);color:#fff;padding:10px 18px 8px;border-radius:99px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;opacity:0;transition:all .35s var(--out);z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast img{width:22px;height:22px}

@media (max-width: 780px){
  body{padding-inline:10px}
  .stage{flex-direction:column;gap:12px;padding-block:10px}
  .presenter{width:100%;max-width:430px;gap:10px}
  .logo,.try,.try-h{display:none}
  .explain{padding:12px 14px;font-size:14px;line-height:1.7}
  .explain b{font-size:16px;margin-bottom:0}
  .phone{width:100%;max-width:430px;height:calc(100dvh - 230px);min-height:600px;border-radius:34px;box-shadow:0 0 0 6px #0B1A32, 0 20px 40px rgba(11,26,50,.22)}
  .scroll{padding-top:26px}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="stage">
  <aside class="presenter">
    <div class="logo"><svg class="mk" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#0B1A32"/><rect x="16" y="9" width="16" height="5" rx="2" fill="#ECAC4E"/><path d="M17 15h14v2c0 2 5 3 5 8v10a5 5 0 0 1-5 5H17a5 5 0 0 1-5-5V25c0-5 5-6 5-8z" fill="#ECAC4E"/></svg><div><b>مكمورة</b><span>تطبيق عائلي للمهام والمكافآت</span></div></div>
    <div class="who" id="who"></div>
    <div class="kidpick" id="kidpick"></div>
    <div class="explain" id="explain"></div>
    <div class="try-h">جرّب بنفسك</div>
    <ol class="try">
      <li>بشاشة الطفل، اكبس على مهمة. بتصير ⏳ يعني «بانتظار موافقة الأهل».</li>
      <li>روح على شاشة الأهل واكبس ✓ للموافقة.</li>
      <li>ارجع على شاشة الطفل وشوف المكمورة تمتلي بالمصاري.</li>
    </ol>
    <div class="ctrls">
      <button class="chip" id="surpriseChip"><img src="assets/pizza.png" alt="">مفاجأة العائلة اليوم</button>
      <button class="chip" id="reset">من جديد</button>
    </div>
  </aside>

  <div class="phone" id="phone">
    <div class="scroll" id="scroll"></div>
    <div id="layer"></div>
    <canvas class="fx" id="fx"></canvas>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
/* Illustrations: Microsoft Fluent Emoji 3D (MIT), used as prototype art. */
const A = n => `assets/${n}.png`;
const G = {
  check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  back:'<path d="m15 18-6-6 6-6"/>', plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
};
const g = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[n]}</svg>`;
const COIN = `<svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAD58E"/><stop offset=".55" stop-color="#ECAC4E"/><stop offset="1" stop-color="#C98A2E"/></linearGradient></defs><circle cx="12" cy="12" r="11" fill="url(#cg)"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="#B87A22" stroke-opacity=".45" stroke-width="1.2"/><path d="m12 7.6 1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4z" fill="#FFF3D6"/></svg>`;

const TASKS = {
  brush:{img:'toothbrush', label:'أسناني'},
  bed:  {img:'bed',        label:'سريري'},
  pray: {img:'mosque',     label:'صلاتي'},
  read: {img:'books',      label:'قراءة'},
  bag:  {img:'backpack',   label:'شنطتي'},
  toys: {img:'teddy_bear', label:'ألعابي'},
  water:{img:'droplet',    label:'المي'},
};
const REWARDS = [
  {id:'pizza', img:'pizza',            short:'بيتزا',        title:'بيتزا على الغدا اليوم'},
  {id:'ice',   img:'soft_ice_cream',   short:'آيس كريم',     title:'آيس كريم بعد العشا'},
  {id:'movie', img:'clapper_board',    short:'ليلة أفلام',   title:'ليلة أفلام عائلية'},
  {id:'brk',   img:'pancakes',         short:'فطور مميز',    title:'فطور مميز بكرة الصبح'},
  {id:'park',  img:'deciduous_tree',   short:'نزهة',         title:'نزهة نهاية الأسبوع'},
  {id:'fun',   img:'playground_slide', short:'مدينة ألعاب',  title:'زيارة مدينة ألعاب'},
  {id:'play',  img:'video_game',       short:'لعب عائلي',    title:'وقت لعب عائلي'},
  {id:'pick',  img:'popcorn',          short:'اختاروا فيلم', title:'اختاروا فيلم الليلة'},
  {id:'sweet', img:'shortcake',        short:'حلوى',         title:'حلوى بعد العشا'},
];
const CONDS = [
  {id:'all',      img:'check_mark_button', label:'كلهم خلّصوا كل مهامهم'},
  {id:'count',    img:'hundred_points',    label:'العيلة خلّصت عدد مهام'},
  {id:'weekly',   img:'trophy',            label:'وصلنا هدف الأسبوع'},
  {id:'selected', img:'star',              label:'كلهم عملوا مهام معيّنة'},
  {id:'manual',   img:'wrapped_gift',      label:'مفاجأة هلأ'},
];
const VALUE = 2;

function seed(){ return {
  view:0, sheet:null, revealOpen:false, pop:null, shown:{}, draft:null,
  kids:[
    {id:'salim', name:'سليم', c1:'#79A6D2', c2:'#3E6C9C', bal:84,  goal:{img:'bicycle',       name:'دراجة',      target:120}, tasks:{brush:'done',bed:'done',pray:'wait',read:'todo',bag:'todo'}},
    {id:'louai', name:'لؤي',  c1:'#F2B083', c2:'#D2774A', bal:37,  goal:{img:'artist_palette',name:'علبة ألوان', target:50},  tasks:{brush:'done',bed:'todo',toys:'todo',water:'wait'}},
    {id:'joud',  name:'جود',  c1:'#B3A3DA', c2:'#7461AE', bal:152, goal:{img:'camera',        name:'كاميرا',     target:300}, tasks:{brush:'done',pray:'done',read:'done',bag:'wait',bed:'todo'}},
  ],
  reward:{rid:'pizza', cond:'all', seen:{}, done:false},
  plan:{rid:'movie', cond:'all', count:12, tasks:['bed','brush'], secret:true},
}}
let S = seed();
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R = id=>REWARDS.find(r=>r.id===id);
const cnt = k=>{const v=Object.values(k.tasks);return{done:v.filter(s=>s==='done').length,wait:v.filter(s=>s==='wait').length,all:v.length}};
const av = (k,extra='')=>`<div class="av" style="--c1:${k.c1};--c2:${k.c2}" ${extra}>${k.photo?`<img src="${k.photo}" alt="">`:esc(k.name[0])}</div>`;
const img = (n,cls='',alt='')=>`<img class="${cls}" src="${A(n)}" alt="${alt}" draggable="false">`;

// coins are laid out full-height; shift them down so the pile's top sits at the goal fraction (shoulder = full)
const jarShift = p => (172 - p*112) - 36;
/* ---------- The Makmoura jar: fills with coins as the child nears the goal ---------- */
function jarSVG(k){
  const shown = S.shown[k.id] ?? k.bal, pct = Math.min(1, shown/k.goal.target);
  const bot=168;
  let coins='';
  for(let r=0; r<13; r++){
    const y = bot-6-r*10.5, off = r%2?9:0;
    for(let x=24+off; x<=126; x+=18) coins += `<ellipse cx="${x}" cy="${y}" rx="10" ry="6" fill="url(#cf)" stroke="#C98A2E" stroke-width="1.2"/><ellipse cx="${x}" cy="${y-1.2}" rx="6" ry="3" fill="none" stroke="#FFF1CF" stroke-opacity=".7" stroke-width="1"/>`;
  }
  const body = 'M44 34h62v6c0 7 22 11 22 30v82a22 22 0 0 1-22 22H44a22 22 0 0 1-22-22V70c0-19 22-23 22-30z';
  return `<svg class="jar" viewBox="0 0 150 180" aria-hidden="true">
    <defs>
      <linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD892"/><stop offset="1" stop-color="#E9A443"/></linearGradient>
      <clipPath id="jc-${k.id}"><path d="${body}"/></clipPath>
    </defs>
    <ellipse cx="75" cy="176" rx="50" ry="4" fill="#0B1A32" opacity=".08"/>
    <path d="${body}" fill="#F3F7FA"/>
    <g clip-path="url(#jc-${k.id})"><g class="coins" data-jar="${k.id}" style="transform:translateY(${jarShift(pct)}px)">${coins}</g></g>
    <path d="${body}" fill="none" stroke="#C9D6E0" stroke-width="3"/>
    <path d="M34 78c-4 22-4 48 0 70" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".85"/>
    <rect x="38" y="8" width="74" height="22" rx="8" fill="#0B1A32"/>
    <rect x="34" y="26" width="82" height="10" rx="5" fill="#1D3157"/>
    <rect x="48" y="14" width="30" height="4" rx="2" fill="#ECAC4E" opacity=".9"/>
    <rect x="42" y="92" width="66" height="40" rx="14" fill="#fff" opacity=".95"/>
    <text class="jar-num" x="75" y="122" text-anchor="middle" font-size="30" fill="#0B1A32" data-num="${k.id}">${shown}</text>
  </svg>`;
}

/* ---------- Child ---------- */
function childScreen(i){
  const k=S.kids[i], c=cnt(k), left=Math.max(0,k.goal.target-k.bal), keys=Object.keys(k.tasks);
  const others=S.kids.filter((_,n)=>n!==i);
  return `<div class="stack">
    <header class="top">${av(k)}<h1><small>${new Date().getHours()<12?'صباح الخير':'مسا الخير'}</small>${esc(k.name)}</h1>
      <button class="fam" data-act="family" aria-label="عيلتي"><span class="faces">${others.map(o=>av(o)).join('')}</span></button></header>

    <button class="mk-card" data-act="goal" aria-label="مكمورتي: ${k.bal}، هدفي ${esc(k.goal.name)}">
      ${jarSVG(k)}
      <div class="goal"><div class="pic">${img(k.goal.img)}${img('sparkles','star')}</div>
        <b>${esc(k.goal.name)}</b>
        ${left?`<span class="pill">باقي ${left} ${COIN}</span>`:`<span class="pill">وصلت!</span>`}</div>
    </button>

    <section>
      <div class="h2"><h2>مهامي اليوم</h2><span class="count" aria-label="${c.done+c.wait} من ${c.all}">${keys.map(t=>`<i class="${k.tasks[t]==='done'?'on':k.tasks[t]==='wait'?'wait':''}"></i>`).join('')}</span></div>
      <div class="tasks" style="margin-top:14px">${keys.map((t,n)=>{
        const s=k.tasks[t], wide = keys.length%2 && n===keys.length-1;
        const badge = s==='done'?img('check_mark_button','st'):s==='wait'?img('hourglass_not_done','st'):'';
        return `<button class="task ${s} ${wide?'wide':''} ${S.pop===k.id+t?'pop':''}" data-act="task" data-t="${t}" aria-label="${TASKS[t].label}${s==='wait'?'، بانتظار الموافقة':s==='done'?'، تم':''}">
          ${badge}${img(TASKS[t].img,'art')}<span class="lb">${TASKS[t].label}</span></button>`}).join('')}</div>
    </section>
    ${rewardCard(false)}
  </div>`;
}

function reasonText(r){
  return {all:'لأنكم خلّصتوا كل مهامكم مبارح',count:`لأنكم خلّصتوا ${r.count||12} مهمة سوا مبارح`,weekly:'لأنكم وصلتوا هدف الأسبوع سوا',selected:'لأنكم كلكم عملتوا مهامكم المهمة مبارح',manual:'مفاجأة من ماما وبابا، لأنكم أبطال'}[r.cond];
}
function rewardCard(parent){
  const r=S.reward; if(!r||r.done) return '';
  const w=R(r.rid);
  return `<section class="fr" aria-label="مفاجأة العائلة">
    ${img('party_popper','pp a')}${img('party_popper','pp b')}
    <div class="glow">${img(w.img)}</div>
    <div class="ey">مفاجأة اليوم!</div>
    <div class="why">${reasonText(r)}</div>
    <div class="what">${esc(w.title)}</div>
    <div class="us"><span class="faces">${S.kids.map(k=>av(k)).join('')}</span>أنجزناها سوا</div>
    ${parent?`<div class="done-btn"><button class="btn soft" data-act="rdone">${g('check')}تمّت المفاجأة</button></div>`:''}
  </section>`;
}

/* ---------- Parent ---------- */
function ringSVG(p,color){const r=36,C=2*Math.PI*r;return `<svg viewBox="0 0 80 80" width="80" height="80"><circle cx="40" cy="40" r="${r}" fill="none" stroke="rgba(11,26,50,.07)" stroke-width="5"/><circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:stroke-dashoffset .8s var(--out)"/></svg>`}
function parentScreen(){
  const pend=[]; S.kids.forEach((k,i)=>Object.entries(k.tasks).forEach(([t,s])=>{if(s==='wait')pend.push({i,t})}));
  const date=new Intl.DateTimeFormat('ar',{weekday:'long',day:'numeric',month:'long',numberingSystem:'latn'}).format(new Date());
  const p=S.plan;
  return `<div class="stack">
    <header class="ph"><small>${date}</small><h1>العيلة اليوم</h1></header>
    <section class="kids">${S.kids.map(k=>{const c=cnt(k),full=c.done===c.all;return `<div class="kid"><div class="rg">${ringSVG(c.done/c.all,full?'var(--green)':'var(--gold)')}${av(k)}</div><b>${esc(k.name)}</b><span class="${full?'full':''}">${full?'خلّص كل شي':`${c.done} من ${c.all}`}</span></div>`}).join('')}</section>
    ${pend.length?`<section class="appr"><div class="hd"><h2>بانتظار موافقتك</h2><span class="n">${pend.length}</span></div>
      ${pend.map(({i,t})=>{const k=S.kids[i];return `<div class="row"><span class="art">${img(TASKS[t].img)}</span><span class="tx">${av(k)}${esc(k.name)} <span>${TASKS[t].label}</span></span><button class="ok" data-act="approve" data-i="${i}" data-t="${t}" aria-label="موافقة ${esc(k.name)} ${TASKS[t].label}">${g('check')}</button></div>`}).join('')}
      ${pend.length>1?`<button class="btn navy block" data-act="approveAll">${g('check')}وافق على الكل</button>`:''}</section>`
    :`<section class="calm">${img('check_mark_button')}<div><b>كل شي تمام</b><span>ما في شي بانتظارك</span></div></section>`}
    ${rewardCard(true)}
    <button class="gift-row" data-act="plan">${img(p?R(p.rid).img:'wrapped_gift')}<span class="t"><b>${p?`مفاجأة جاهزة: ${esc(R(p.rid).short)}`:'جهّز مفاجأة للعيلة'}</b><span>${p?'بتطلع للأولاد لما يخلّصوا كلهم مهامهم':'شي حلو بيصير لما ينجزوا سوا'}</span></span><span class="go">${p?g('back'):g('plus')}</span></button>
  </div>`;
}

/* ---------- Sheets ---------- */
function goalSheet(){
  const k=S.kids[S.view], left=Math.max(0,k.goal.target-k.bal), keys=Object.keys(k.tasks), per=keys.length*VALUE;
  const days=[['اليوم',cnt(k).done],['مبارح',keys.length,'pizza'],['الخميس',keys.length-1],['الأربعاء',keys.length]];
  return `<div class="sh"><h2>هدفي</h2><button class="x" data-act="close" aria-label="إغلاق">${g('x')}</button></div>
  <div class="gsheet">${img(k.goal.img,'big')}<h3>${esc(k.goal.name)}</h3>
    <div class="nums"><b>${k.bal}</b> من ${k.goal.target}</div>
    <div class="bar"><i style="width:${Math.min(100,k.bal/k.goal.target*100)}%"></i></div>
    ${left?`<span class="pill">باقي ${left} ${COIN} · تقريباً ${Math.ceil(left/per)} أيام</span>`:''}
    <div class="days"><div class="dh">أيامي</div>
    ${days.map(([d,n,m])=>`<div class="day"><b>${d}</b><span class="ic">${keys.map((t,j)=>`<img src="${A(TASKS[t].img)}" class="${j<n?'':'no'}" alt="">`).join('')}</span><span class="earn">+${n*VALUE}${COIN}</span></div>
      ${m?`<div class="day moment"><span class="ic">${img(m)}أنجزناها سوا، وأكلنا بيتزا!</span></div>`:''}`).join('')}</div>
  </div>`;
}
function familySheet(){
  const i=S.view, t=S.kids.reduce((a,k)=>{const c=cnt(k);a.d+=c.done+c.wait;a.n+=c.all;return a},{d:0,n:0});
  const order=[i,...S.kids.map((_,n)=>n).filter(n=>n!==i)], p=S.plan;
  return `<div class="sh"><h2>عيلتي</h2><button class="x" data-act="close" aria-label="إغلاق">${g('x')}</button></div>
  <div class="together"><div class="t">${t.d===t.n?'أحسنتم يا أبطال!':'سوا اليوم'}<span>${t.d} من ${t.n}</span></div><div class="bar"><i style="width:${t.d/t.n*100}%"></i></div></div>
  ${p?`<div class="teaser">${img(p.secret?'wrapped_gift':R(p.rid).img)}<span>${p.secret?'في مفاجأة للعيلة إذا خلّصنا مهامنا كلنا':`إذا خلّصنا كلنا: ${esc(R(p.rid).title)}`}</span></div>`:''}
  <div class="car" id="car">${order.map(n=>{const k=S.kids[n];return `<article class="sib">${av(k)}<h4>${esc(k.name)}${n===i?'<em>أنا</em>':''}</h4>
    <div class="ics">${Object.entries(k.tasks).map(([t,s])=>`<span class="${s==='todo'?'todo':''}">${img(TASKS[t].img)}${s==='done'?img('check_mark_button','ok2'):s==='wait'?img('hourglass_not_done','ok2'):''}</span>`).join('')}</div></article>`}).join('')}</div>
  <div class="dots" id="dots">${order.map((_,n)=>`<i class="${n?'':'on'}"></i>`).join('')}</div>`;
}
function planSheet(){
  const d=S.draft;
  return `<div class="sh"><h2>مفاجأة للعيلة</h2><button class="x" data-act="close" aria-label="إغلاق">${g('x')}</button></div>
  <div class="step">شو المفاجأة؟</div>
  <div class="rgrid">${REWARDS.map(r=>`<button class="ro" aria-pressed="${d.rid===r.id}" data-act="pr" data-id="${r.id}">${img(r.img)}${r.short}</button>`).join('')}</div>
  <div class="step">إمتى بتطلع؟</div>
  ${CONDS.map(c=>`<button class="co" aria-pressed="${d.cond===c.id}" data-act="pc" data-id="${c.id}">${img(c.img)}<span class="t">${c.label}</span><span class="r"></span></button>
    ${d.cond===c.id&&c.id==='count'?`<div class="extra"><button class="sb" data-act="n" data-d="1" aria-label="أكتر">+</button><span class="v">${d.count}</span><button class="sb" data-act="n" data-d="-1" aria-label="أقل">−</button></div>`:''}
    ${d.cond===c.id&&c.id==='selected'?`<div class="extra wrap">${Object.keys(TASKS).map(t=>`<button class="tp" aria-pressed="${d.tasks.includes(t)}" data-act="pt" data-t="${t}" aria-label="${TASKS[t].label}">${img(TASKS[t].img)}</button>`).join('')}</div>`:''}`).join('')}
  <button class="btn navy block" style="margin-top:12px" data-act="save">${d.cond==='manual'?'فاجئهم هلأ':'جاهز'}</button>`;
}

/* ---------- Reveal: once per child, on the day the family earned it ---------- */
function revealHTML(){const r=S.reward,w=R(r.rid);return `<div class="reveal" id="reveal" role="dialog" aria-label="مفاجأة اليوم"><div class="in">
  ${img(w.img,'hero')}<div class="ey">مفاجأة اليوم!</div><div class="why">${reasonText(r)}</div><div class="what">${esc(w.title)}</div>
  <button class="btn gold" data-act="seen">${img('party_popper','').replace('<img','<img style="width:30px;height:30px"')}يا سلام!</button></div></div>`}

/* ---------- Presenter ---------- */
function presenter(){
  const child=S.view!=='parent';
  $('#who').innerHTML=`<button aria-pressed="${child}" data-view="${child?S.view:0}">شاشة الطفل</button><button aria-pressed="${!child}" data-view="parent">شاشة الأهل</button>`;
  $('#kidpick').innerHTML=child?S.kids.map((k,i)=>`<button aria-pressed="${S.view===i}" data-view="${i}">${av(k)}${esc(k.name)}</button>`).join(''):'';
  $('#kidpick').hidden=!child;
  const k=child&&S.kids[S.view];
  $('#explain').innerHTML=child
    ? `<b>هاي شاشة ${esc(k.name)}</b>البرطمان هو «مكمورة» ${esc(k.name)}. كل مهمة بيخلّصها بتنزل فيه مصاري، ولما يمتلي بياخد هدفه: ${esc(k.goal.name)}.`
    : `<b>هاي شاشة الأهل</b>بلمحة بتعرف وين وصل كل ولد، وبكبسة بتوافق على المهام، ومن تحت بتجهّز مفاجأة للعيلة.`;
  $('#surpriseChip').setAttribute('aria-pressed', !!(S.reward&&!S.reward.done));
}

/* ---------- Render ---------- */
function render(){
  const sc=$('#scroll'), key=String(S.view), keep=render.k===key?sc.scrollTop:0; render.k=key;
  sc.innerHTML = S.view==='parent'?parentScreen():childScreen(S.view);
  sc.scrollTop=keep; S.pop=null; presenter();
  // animate jar from what the child last saw to the new balance
  sc.querySelectorAll('[data-jar]').forEach(el=>{
    const k=S.kids.find(x=>x.id===el.dataset.jar), from=S.shown[k.id]??k.bal, to=k.bal; S.shown[k.id]=to;
    if(from===to) return;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform=`translateY(${jarShift(Math.min(1,to/k.goal.target))}px)`}));
    const num=sc.querySelector(`[data-num="${k.id}"]`), t0=performance.now();
    const step=n=>{const p=Math.min(1,(n-t0)/1200),e=1-Math.pow(1-p,3);num.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};
    setTimeout(()=>{requestAnimationFrame(step);burstAt(sc.querySelector('.jar'),24)},300);
  });
  maybeReveal();
}
function openSheet(kind){
  S.sheet=kind; const html={goal:goalSheet,family:familySheet,plan:planSheet}[kind]();
  let sh=$('#layer .sheet');
  if(!sh){$('#layer').innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog"><div class="grab"></div><div class="sb"></div></div>`;sh=$('#layer .sheet');sh.querySelector('.sb').innerHTML=html;requestAnimationFrame(()=>{$('#layer .scrim').classList.add('show');sh.classList.add('show')})}
  else sh.querySelector('.sb').innerHTML=html;
  const car=$('#car'); if(car) car.addEventListener('scroll',()=>{const w=car.firstElementChild.offsetWidth+12,n=Math.round(Math.abs(car.scrollLeft)/w);document.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',j===n))},{passive:true});
}
function closeSheet(){S.sheet=null;const sh=$('#layer .sheet');if(!sh)return;sh.classList.remove('show');$('#layer .scrim').classList.remove('show');setTimeout(()=>{if(!S.sheet&&!S.revealOpen)$('#layer').innerHTML=''},450)}
function maybeReveal(){
  const r=S.reward; if(S.view==='parent'||!r||r.done||r.seen[S.kids[S.view].id]||S.revealOpen) return;
  S.revealOpen=true; $('#layer').innerHTML=revealHTML();
  requestAnimationFrame(()=>{$('#reveal').classList.add('show');setTimeout(()=>burst(.5,.3,110,1),300)});
}
function toast(im,msg){const t=$('#toast');t.innerHTML=img(im)+esc(msg);t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- Confetti ---------- */
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(fx,fy,n,s){
  if(still) return; const cv=$('#fx'),ph=$('#phone'),dpr=devicePixelRatio||1,W=ph.clientWidth,H=ph.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const cols=['#ECAC4E','#FAD58E','#0B1A32','#8EC1EA','#8FD3B0','#F59E8B'];
  const ps=Array.from({length:n},()=>{const a=Math.random()*Math.PI*2,v=(2+Math.random()*6)*s;return{x:fx*W,y:fy*H,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4*s,r:3+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,col:cols[Math.random()*cols.length|0],sq:Math.random()<.5}});
  const t0=performance.now();(function f(now){const t=(now-t0)/1000;c.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.22;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;c.save();c.globalAlpha=Math.max(0,1-t/1.6);c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.col;if(p.sq)c.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{c.beginPath();c.arc(0,0,p.r/1.4,0,7);c.fill()}c.restore()});if(t<1.6)requestAnimationFrame(f);else c.clearRect(0,0,W,H)})(t0);
}
function burstAt(el,n){if(!el)return;const a=el.getBoundingClientRect(),b=$('#phone').getBoundingClientRect();burst((a.left+a.width/2-b.left)/b.width,(a.top+a.height/2-b.top)/b.height,n,.6)}

/* ---------- Actions ---------- */
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');
  if(v){const nv=v.dataset.view==='parent'?'parent':+v.dataset.view;if(nv!==S.view){S.view=nv;S.sheet=null;S.revealOpen=false;$('#layer').innerHTML='';render()}return}
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  if(act==='task'){const k=S.kids[S.view],t=a.dataset.t,s=k.tasks[t];if(s==='done')return;
    k.tasks[t]=s==='todo'?'wait':'todo';S.pop=k.id+t;render();
    if(s==='todo'){burstAt(document.querySelector(`[data-t="${t}"]`),20);const c=cnt(k);if(c.done+c.wait===c.all)setTimeout(()=>burst(.5,.45,90,1),250)}}
  else if(act==='goal'||act==='family') openSheet(act);
  else if(act==='plan'){S.draft=S.plan?{...S.plan,tasks:[...S.plan.tasks]}:{rid:'pizza',cond:'all',count:12,tasks:['bed','brush'],secret:true};openSheet('plan')}
  else if(act==='close') closeSheet();
  else if(act==='seen'){S.reward.seen[S.kids[S.view].id]=true;S.revealOpen=false;$('#reveal').classList.remove('show');setTimeout(()=>{if(!S.sheet)$('#layer').innerHTML=''},350)}
  else if(act==='approve'){const k=S.kids[+a.dataset.i];k.tasks[a.dataset.t]='done';k.bal+=VALUE;render();toast('check_mark_button',`${k.name} +${VALUE}`)}
  else if(act==='approveAll'){let n=0;S.kids.forEach(k=>Object.keys(k.tasks).forEach(t=>{if(k.tasks[t]==='wait'){k.tasks[t]='done';k.bal+=VALUE;n++}}));render();burst(.5,.4,70,.9);toast('check_mark_button',`وافقت على ${n} مهام`)}
  else if(act==='rdone'){S.reward.done=true;render();toast('heart_with_ribbon','صارت ذكرى حلوة للعيلة')}
  else if(act==='pr'){S.draft.rid=a.dataset.id;openSheet('plan')}
  else if(act==='pc'){S.draft.cond=a.dataset.id;openSheet('plan')}
  else if(act==='n'){S.draft.count=Math.max(3,Math.min(40,S.draft.count+(+a.dataset.d)));openSheet('plan')}
  else if(act==='pt'){const t=a.dataset.t,l=S.draft.tasks;S.draft.tasks=l.includes(t)?(l.length>1?l.filter(x=>x!==t):l):[...l,t];openSheet('plan')}
  else if(act==='save'){const d=S.draft;
    if(d.cond==='manual'){S.reward={rid:d.rid,cond:'manual',seen:{},done:false};closeSheet();render();burst(.5,.4,90,1);toast('wrapped_gift','وصلت المفاجأة للأولاد')}
    else{S.plan={...d};closeSheet();render();toast('wrapped_gift','المفاجأة جاهزة')}}
});
$('#surpriseChip').addEventListener('click',()=>{const on=S.reward&&!S.reward.done;S.reward=on?null:{rid:'pizza',cond:'all',seen:{},done:false};S.revealOpen=false;$('#layer').innerHTML='';render()});
$('#reset').addEventListener('click',()=>{S=seed();$('#layer').innerHTML='';render()});
render();
</script>
</body>
</html>
