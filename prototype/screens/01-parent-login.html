<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makmoura Parent Sign-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --navy:#0B1A32; --gold:#ECAC4E; --gold-deep:#9A6412; --gold-soft:#FDEFD6;
  --bg:#FBF7F0; --surface:#FFFFFF; --ink:#0B1A32; --ink-2:#55607A; --ink-3:#98A0B0; --line:rgba(11,26,50,.10);
  --green:#2E9E6E;
  --f-display:"Baloo Bhaijaan 2", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body:"IBM Plex Sans Arabic", system-ui, sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9E2D6;color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;padding-inline:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- desktop: phone on a quiet table ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:24px}
.label{display:flex;flex-direction:column;align-items:center;gap:10px}
.label b{font-family:var(--f-display);font-size:22px;font-weight:700}
.steps{display:flex;gap:6px}
.steps button{height:34px;padding:2px 14px 0;border-radius:99px;background:rgba(255,255,255,.55);font-size:13px;font-weight:500;color:var(--ink-2)}
.steps button[aria-current="step"]{background:var(--navy);color:#fff}
.phone{position:relative;width:390px;height:min(844px, calc(100dvh - 120px));min-height:640px;border-radius:54px;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 11px #0B1A32, 0 0 0 12px #34435f, 0 40px 90px rgba(11,26,50,.28)}

/* ---------- phone-sized screens: the page IS the app ---------- */
@media (max-width: 520px){
  body{padding-inline:0;background:var(--bg)}
  .stage{padding-block:0;gap:0}
  .label{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:560px;border-radius:0;box-shadow:none}
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px 24px 36px;transition:transform .5s var(--out), opacity .4s}
.screen[data-pos="right"]{transform:translateX(-100%);opacity:0;pointer-events:none}
.screen[data-pos="left"]{transform:translateX(100%);opacity:0;pointer-events:none}
@media (max-width:520px){.screen{padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}

/* welcome */
.welcome{background:radial-gradient(120% 60% at 50% 18%, #FFEBC4 0%, #FFF6E6 45%, var(--bg) 80%)}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.jar{width:170px;height:204px;overflow:visible;animation:float 4s ease-in-out 2s infinite}
.jar .coins{transform:translateY(136px);animation:fill 1.8s var(--out) .4s forwards}
@keyframes fill{to{transform:translateY(58px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.name{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1;margin-top:28px;letter-spacing:-.01em}
.tag{font-size:18px;color:var(--ink-2);margin-top:12px}
.actions{display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{width:100%;height:60px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;padding-top:3px;transition:transform .15s, opacity .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 10px 24px -12px rgba(201,138,46,.8)}
.btn.outline{background:var(--surface);color:var(--navy);box-shadow:inset 0 0 0 1.5px rgba(11,26,50,.14)}
.btn.primary{background:var(--navy);color:#fff;box-shadow:0 10px 24px -10px rgba(11,26,50,.6)}
.btn[disabled]{opacity:.28;box-shadow:none;cursor:default}
.btn svg{width:22px;height:22px;margin-top:-3px}
.link{font-size:15px;color:var(--ink-2);font-weight:500;padding:8px}
.link b{color:var(--gold-deep);font-weight:600}
.legal{font-size:12px;color:var(--ink-3);text-align:center;line-height:1.6}

/* form screens */
.back{width:44px;height:44px;border-radius:50%;background:rgba(11,26,50,.06);display:grid;place-items:center;margin-inline-start:-4px}
.back svg{width:22px;height:22px}
.form h1{margin:28px 0 0;font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.15}
.spacer{flex:1}

.badge{align-self:flex-start;margin-top:22px;padding:6px 14px 4px;border-radius:99px;background:var(--gold-soft);color:var(--gold-deep);font-family:var(--f-display);font-weight:600;font-size:14px}
.badge[hidden]{display:none}
.badge:not([hidden]) + h1{margin-top:12px}
.fields{flex:1;display:flex;flex-direction:column;gap:18px;margin-top:28px}
.fields .btn{flex:none}
.fields .legal,.fields .link{align-self:center}
.f{display:flex;flex-direction:column;gap:6px;position:relative}
.f span{font-size:14px;font-weight:600;color:var(--ink-2)}
.f input{height:58px;border-radius:18px;border:0;background:var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:2px 18px 0;font:500 17px var(--f-body);color:var(--ink);outline:none;transition:box-shadow .2s;width:100%}
.f input[dir="ltr"]{text-align:left}
.f input:focus{box-shadow:0 0 0 2.5px var(--navy)}
.f input::placeholder{color:#B9BFCB}
.eye{position:absolute;left:10px;bottom:9px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.eye svg{width:20px;height:20px}
.eye[aria-pressed="true"]{color:var(--navy)}
.f input[type="password"],.f input[data-pw]{padding-left:56px}
.forgot{align-self:flex-start;font-size:14px;font-weight:600;color:var(--gold-deep);padding:2px 0}
/* done */
.done{align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 60% at 50% 40%, #FFEBC4 0%, var(--bg) 70%)}
.tick{width:108px;height:108px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(46,158,110,.12);transform:scale(0);transition:transform .6s var(--spring) .1s}
.tick svg{width:52px;height:52px;color:#fff;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .5s ease .5s}
.screen.done[data-pos="center"] .tick{transform:none}
.screen.done[data-pos="center"] .tick svg{stroke-dashoffset:0}
.done h1{margin:30px 0 0;font-family:var(--f-display);font-size:36px;font-weight:800}
.done p{margin:8px 0 0;font-size:17px;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.jar .coins{transform:translateY(58px)}}
</style>
</head>
<body>
<div class="stage">
  <div class="label"><b>الشاشة ١ · دخول الأهل</b>
    <nav class="steps" id="steps" aria-label="مراحل الشاشة"></nav></div>

  <main class="phone" id="phone">
    <!-- 1. Welcome -->
    <section class="screen welcome" data-s="welcome">
      <div class="hero">
        <svg class="jar" viewBox="0 0 150 180" aria-hidden="true" id="jar"></svg>
        <div class="name">مكمورة</div>
        <div class="tag">مهام صغيرة… وأحلام كبيرة</div>
      </div>
      <div class="actions">
        <button class="btn gold" data-go="signup" data-mode="trial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
          جرّب مجاناً <span class="trial-days">14</span> يوم</button>
        <button class="btn outline" data-go="signup" data-mode="account">إنشاء حساب</button>
        <button class="link" data-go="login">عندك حساب؟ <b>تسجيل الدخول</b></button>
      </div>
    </section>

    <!-- 2. Sign up (full account, or free trial) -->
    <section class="screen form" data-s="signup" data-pos="right">
      <button class="back" data-go="welcome" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="badge" id="trialBadge">تجربة مجانية · 14 يوم · بدون بطاقة دفع</div>
      <h1 id="signupTitle">حساب جديد</h1>
      <form class="fields" id="signupForm" novalidate>
        <label class="f"><span>اسمك</span><input id="su-name" autocomplete="name" placeholder="مثلاً: أم سليم"></label>
        <label class="f"><span>البريد الإلكتروني</span><input id="su-email" type="email" dir="ltr" autocomplete="email" placeholder="name@email.com"></label>
        <label class="f"><span>كلمة السر</span><input id="su-pass" type="password" dir="ltr" autocomplete="new-password" placeholder="8 أحرف أو أكتر"><button type="button" class="eye" data-eye aria-label="إظهار كلمة السر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
        <div class="spacer"></div>
        <button class="btn primary" id="signupBtn" disabled>إنشاء الحساب</button>
        <div class="legal">بإنشاء الحساب بتوافق على الشروط وسياسة الخصوصية</div>
      </form>
    </section>

    <!-- 3. Sign in -->
    <section class="screen form" data-s="login" data-pos="right">
      <button class="back" data-go="welcome" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <h1>أهلاً من جديد</h1>
      <form class="fields" id="loginForm" novalidate>
        <label class="f"><span>البريد الإلكتروني</span><input id="li-email" type="email" dir="ltr" autocomplete="username" placeholder="name@email.com"></label>
        <label class="f"><span>كلمة السر</span><input id="li-pass" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••"><button type="button" class="eye" data-eye aria-label="إظهار كلمة السر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
        <button type="button" class="forgot">نسيت كلمة السر؟</button>
        <div class="spacer"></div>
        <button class="btn primary" id="loginBtn" disabled>تسجيل الدخول</button>
        <button type="button" class="link" data-go="signup" data-mode="account">ما عندك حساب؟ <b>أنشئ حساب</b></button>
      </form>
    </section>

    <!-- 4. Signed in -->
    <section class="screen done" data-s="done" data-pos="right">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h1 id="doneTitle">أهلاً فيك!</h1>
      <p id="doneSub">خلّينا نعرّف عيلتك…</p>
    </section>
  </main>
</div>

<script>
const TRIAL_DAYS=14; // the agreed free-trial length
const ORDER=['welcome','signup','login','done'];
const NAMES={welcome:'الترحيب',signup:'حساب جديد',login:'تسجيل الدخول',done:'تم'};
const $=s=>document.querySelector(s);
let cur='welcome', mode='account';
document.querySelectorAll('.trial-days').forEach(e=>e.textContent=TRIAL_DAYS);
$('#trialBadge').textContent=`تجربة مجانية · ${TRIAL_DAYS} يوم · بدون بطاقة دفع`;

/* the Makmoura jar: coins rise into it when the app opens */
(function drawJar(){
  const body='M44 34h62v6c0 7 22 11 22 30v82a22 22 0 0 1-22 22H44a22 22 0 0 1-22-22V70c0-19 22-23 22-30z';
  let coins='';
  for(let r=0;r<13;r++){const y=162-r*10.5,off=r%2?9:0;for(let x=24+off;x<=126;x+=18)coins+=`<ellipse cx="${x}" cy="${y}" rx="10" ry="6" fill="url(#cf)" stroke="#C98A2E" stroke-width="1.2"/><ellipse cx="${x}" cy="${y-1.2}" rx="6" ry="3" fill="none" stroke="#FFF1CF" stroke-opacity=".7"/>`}
  $('#jar').innerHTML=`<defs><linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD892"/><stop offset="1" stop-color="#E9A443"/></linearGradient><clipPath id="jc"><path d="${body}"/></clipPath></defs>
    <ellipse cx="75" cy="177" rx="52" ry="5" fill="#0B1A32" opacity=".08"/>
    <path d="${body}" fill="#F6F9FB"/>
    <g clip-path="url(#jc)"><g class="coins">${coins}</g></g>
    <path d="${body}" fill="none" stroke="#C9D6E0" stroke-width="3"/>
    <path d="M34 78c-4 22-4 48 0 70" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".85"/>
    <rect x="38" y="8" width="74" height="22" rx="8" fill="#0B1A32"/><rect x="34" y="26" width="82" height="10" rx="5" fill="#1D3157"/><rect x="48" y="14" width="30" height="4" rx="2" fill="#ECAC4E"/>`;
})();

function go(to){
  const order=to==='login'?['welcome','login','signup','done']:ORDER, i=order.indexOf(to);
  document.querySelectorAll('.screen').forEach(s=>{const j=order.indexOf(s.dataset.s);s.dataset.pos=j<i?'left':j>i?'right':'center'});
  cur=to; steps();
  if(to==='signup'){
    const trial=mode==='trial';
    $('#trialBadge').hidden=!trial;
    $('#signupTitle').textContent=trial?'خلّينا نبلّش':'حساب جديد';
    $('#signupBtn').textContent=trial?'ابدأ التجربة':'إنشاء الحساب';
  }
  if(to==='done'){
    $('#doneTitle').textContent = mode==='login' ? 'أهلاً من جديد!' : 'أهلاً فيك!';
    $('#doneSub').textContent = mode==='trial' ? `تجربتك المجانية بلّشت: ${TRIAL_DAYS} يوم` : mode==='login' ? 'عم نفتح عيلتك…' : 'خلّينا نعرّف عيلتك…';
  }
}
function steps(){ $('#steps').innerHTML=ORDER.map(s=>`<button data-go="${s}" ${s===cur?'aria-current="step"':''}>${NAMES[s]}</button>`).join('') }

/* buttons wake up only when the form is complete */
const okEmail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim());
function check(){
  $('#signupBtn').disabled=!($('#su-name').value.trim() && okEmail($('#su-email').value) && $('#su-pass').value.length>=8);
  $('#loginBtn').disabled=!(okEmail($('#li-email').value) && $('#li-pass').value.length>=1);
}
document.addEventListener('input',check);
$('#signupForm').addEventListener('submit',e=>{e.preventDefault(); if(!$('#signupBtn').disabled) go('done')});
$('#loginForm').addEventListener('submit',e=>{e.preventDefault(); if(!$('#loginBtn').disabled){mode='login';go('done')}});
document.addEventListener('click',e=>{
  const eye=e.target.closest('[data-eye]');
  if(eye){const inp=eye.parentElement.querySelector('input');const show=inp.type==='password';inp.type=show?'text':'password';inp.dataset.pw='1';eye.setAttribute('aria-pressed',show);return}
  const g=e.target.closest('[data-go]'); if(!g) return;
  if(g.dataset.mode) mode=g.dataset.mode; else if(g.dataset.go==='login') mode='login';
  go(g.dataset.go);
});
steps();
</script>
</body>
</html>
