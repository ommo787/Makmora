<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makmoura Task Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Same native iOS system as screen 1. */
:root{
  color-scheme: light;
  --bg:#FFFFFF; --grouped:#F2F2F7; --cell:#FFFFFF;
  --label:#000000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --yellow:#FFCC00; --pink:#FF2D55;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --glass:rgba(255,255,255,.72);
  --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.64,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#E5E5EA;color:var(--label);font-family:var(--font);-webkit-font-smoothing:antialiased;padding-inline:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid rgba(0,122,255,.5);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none}

/* desktop preview */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:24px}
.label{display:flex;flex-direction:column;align-items:center;gap:10px}
.label b{font-size:17px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;justify-content:center;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;max-width:560px}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500}
.seg button[aria-current="step"]{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);font-weight:600}
.phone{position:relative;width:390px;height:min(844px, calc(100dvh - 110px));min-height:660px;border-radius:55px;overflow:hidden;background:var(--grouped);
  box-shadow:0 0 0 12px #1C1C1E, 0 0 0 13px #3A3A3C, 0 30px 80px rgba(0,0,0,.25)}
.chrome{position:absolute;inset:0;pointer-events:none;z-index:60}
.sb{position:absolute;top:0;inset-inline:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0;direction:ltr;font:600 17px/1 "Inter",-apple-system,sans-serif;color:#000}
.sb .ic{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:#000}
@media (max-width: 520px){
  body{padding-inline:0;background:var(--grouped)}
  .stage{padding-block:0;gap:0}
  .label,.chrome{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:560px;border-radius:0;box-shadow:none}
}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 20px 34px;transition:transform .45s var(--out), opacity .35s;overflow-y:auto;scrollbar-width:none;background:var(--grouped)}
.screen::-webkit-scrollbar{display:none}
.screen[data-pos="right"]{transform:translateX(-100%);opacity:0;pointer-events:none}
.screen[data-pos="left"]{transform:translateX(30%);opacity:0;pointer-events:none}
@media (max-width:520px){.screen{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.nav{height:52px;margin-top:54px;display:flex;align-items:center;justify-content:space-between;flex:none}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08), inset 0 1px 0 #fff, 0 2px 10px rgba(0,0,0,.08);transition:transform .35s var(--spring)}
.back:active{transform:scale(.9)}
.back svg{width:22px;height:22px}
.who{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 14px;border-radius:99px;background:var(--glass);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08), 0 2px 10px rgba(0,0,0,.06);font-size:15px;font-weight:600}
.who .kav{width:28px;height:28px;font-size:13px}
h1{margin:14px 0 0;font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.sub{margin-top:6px;font-size:16px;color:var(--label-2);line-height:1.5}
.spacer{flex:1;min-height:20px}
.kav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;flex:none;background:#E6F1FF;overflow:hidden}
.kav img{width:84%;height:84%;object-fit:contain;margin-top:8%}

.btn{width:100%;height:54px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;transition:transform .35s var(--spring), background .2s}
.btn:active{transform:scale(.96)}
.btn.filled{background:var(--blue);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 6px 18px -6px rgba(0,122,255,.55)}
.btn[disabled]{background:rgba(118,118,128,.14);color:var(--label-3);box-shadow:none;cursor:default}
.bottom{position:sticky;bottom:0;padding-top:14px;margin-top:auto;background:linear-gradient(rgba(242,242,247,0),var(--grouped) 30%)}
.hint{text-align:center;font-size:13px;color:var(--label-2);margin-top:10px}

/* app-style icon tile (like iOS Settings / Reminders) */
.glyph{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb, var(--c) 12%, #fff);flex:none}
.glyph svg{width:28px;height:28px}
.glyph.sm{width:36px;height:36px;border-radius:10px}
.glyph.sm svg{width:21px;height:21px}

/* task picker grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 4px 12px;border-radius:24px;background:#fff;font-size:14px;font-weight:500;line-height:1.3;text-align:center;transition:transform .35s var(--spring), box-shadow .2s}
.pick:active{transform:scale(.94)}
.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--blue)}
.pick .ok{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .35s var(--spring)}
.pick .ok svg{width:13px;height:13px}
.pick[aria-pressed="true"] .ok{transform:scale(1)}
.pick.new{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(60,60,67,.18);color:var(--blue)}
.pick.new .glyph{background:transparent;color:var(--blue)}

/* task list with delete */
.tlist .row{min-height:60px}
.tlist .t b{font-size:17px;font-weight:500}
.del{width:30px;height:30px;border-radius:50%;background:rgba(118,118,128,.14);color:var(--label-2);display:grid;place-items:center;flex:none;transition:transform .3s var(--spring)}
.del:active{transform:scale(.85)}
.del svg{width:14px;height:14px}
.addrow{color:var(--blue);font-size:17px}
.addrow .glyph{background:rgba(0,122,255,.12);color:var(--blue);box-shadow:none}
.row.leaving{animation:leave .3s var(--out) forwards}
@keyframes leave{to{opacity:0;transform:translateX(-30px)}}
.empty{padding:22px 16px;text-align:center;color:var(--label-2);font-size:15px}
.lib{grid-template-columns:repeat(3,1fr);margin-top:0}
.lib .pick{background:#fff}
.lib .pick .state{font-size:12px;font-weight:600;color:var(--blue);min-height:15px;margin-top:-4px}
.lib .pick[aria-pressed="true"]{background:rgba(0,122,255,.06)}
.lib .pick.justadded .glyph{animation:added .5s var(--spring)}
.lib .pick.justadded .ok{animation:tick .45s var(--spring)}
@keyframes added{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes tick{0%{transform:scale(0)}100%{transform:scale(1)}}
.addbtn{height:44px;margin-top:12px}
/* grouped list */
.group{margin-top:22px;background:#fff;border-radius:26px;overflow:hidden;flex:none}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;position:relative;width:100%;text-align:start}
.row + .row::before{content:"";position:absolute;top:0;inset-inline-start:64px;inset-inline-end:0;height:.5px;background:var(--sep)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:17px;font-weight:500}
.row .t > span{display:block;font-size:13px;color:var(--blue);margin-top:1px}
.stepper{display:flex;align-items:center;background:rgba(118,118,128,.12);border-radius:99px;height:36px;direction:ltr}
.stepper button{width:40px;height:36px;display:grid;place-items:center;border-radius:99px}
.stepper button:active{background:rgba(118,118,128,.2)}
.stepper button svg{width:16px;height:16px}
.stepper .v{min-width:56px;display:flex;align-items:center;justify-content:center;gap:3px}
.stepper input{width:34px;border:0;background:none;outline:none;text-align:center;font:600 16px var(--font);font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
.stepper input:focus{background:#fff;border-radius:8px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.coin{width:18px;height:18px;flex:none}
.total{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:15px;color:var(--label-2)}
.total b{color:var(--label);display:inline-flex;align-items:center;gap:4px}

/* goal */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.amount{margin-top:22px;background:#fff;border-radius:26px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.amount .lbl{font-size:15px;color:var(--label-2)}
.amount .big{display:flex;align-items:center;gap:18px;direction:ltr}
.amount .big .n{display:flex;align-items:center;justify-content:center;gap:6px}
.amount .big input{width:120px;border:0;outline:none;background:none;text-align:center;font:700 44px var(--font);font-variant-numeric:tabular-nums;padding:0;border-radius:14px;-moz-appearance:textfield}
.amount .big input:focus{background:var(--grouped)}
.amount .big .n .coin{width:30px;height:30px}
.amount .big button{width:44px;height:44px;border-radius:50%;background:rgba(118,118,128,.12);display:grid;place-items:center}
.amount .big button svg{width:20px;height:20px}
.amount .eta{font-size:14px;color:var(--label-2);text-align:center;line-height:1.5}
.amount .eta b{color:var(--label)}
.namerow{margin-top:14px;background:#fff;border-radius:26px;display:flex;align-items:center;padding:0 16px;min-height:52px}
.namerow label{width:80px;font-size:17px}
.namerow .glyph{margin-inline-start:10px}
.autonote{font-size:13px;color:var(--label-2);padding:8px 16px 0;display:flex;align-items:center;gap:6px}
.autonote svg{width:14px;height:14px;color:var(--purple,#AF52DE)}
.namerow input{flex:1;height:52px;border:0;outline:none;background:none;font:17px var(--font)}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;top:54px;background:var(--grouped);border-radius:14px 14px 0 0;z-index:21;padding:0 20px 28px;transform:translateY(105%);transition:transform .45s var(--out);overflow-y:auto}
.sheet.show{transform:none}
.sheet.short{top:auto;border-radius:40px;inset-inline:8px;bottom:8px}
.ksbar{display:flex;align-items:center;justify-content:space-between;height:56px;font-size:17px}
.ksbar b{font-weight:600}
.ksbar button{color:var(--blue)}
.ksbar .done{font-weight:600}
.ksbar .done[disabled]{color:var(--label-3)}
.preview{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.preview .glyph{width:84px;height:84px;border-radius:24px}
.preview .glyph svg{width:44px;height:44px}
.field{margin-top:18px;background:#fff;border-radius:26px;display:flex;align-items:center;padding:0 16px;min-height:52px}
.field label{width:70px;font-size:17px}
.field input{flex:1;height:52px;border:0;outline:none;background:none;font:17px var(--font)}
.slabel{font-size:13px;color:var(--label-2);margin:22px 16px 8px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#fff;border-radius:26px;padding:14px}
.icons button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;color:var(--label-2)}
.icons button svg{width:24px;height:24px}
.icons button[aria-pressed="true"]{background:var(--c);color:#fff}
.colors{display:flex;justify-content:space-between;background:#fff;border-radius:26px;padding:14px 16px}
.colors button{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff, 0 0 0 5.5px var(--c)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
.days button{height:44px;border-radius:14px;background:rgba(118,118,128,.12);font-size:12px;font-weight:600}
.days button[aria-pressed="true"]{background:var(--blue);color:#fff}
.presets{display:flex;gap:8px;margin-top:16px}
.presets button{flex:1;height:40px;border-radius:99px;background:rgba(118,118,128,.12);font-size:14px;font-weight:600}
.presets button[aria-pressed="true"]{background:rgba(0,122,255,.14);color:var(--blue)}
.sheet .btn{margin-top:22px}

/* ready: one brief per child */
.brief{margin-top:18px;background:#fff;border-radius:26px;padding:16px;flex:none}
.brief header{display:flex;align-items:center;gap:12px}
.brief header b{display:block;font-size:20px;font-weight:700}
.brief header span{display:block;font-size:14px;color:var(--label-2);margin-top:1px}
.kav.big{width:60px;height:60px}
.brief ul{list-style:none;margin:14px 0 0;padding:0}
.brief li{display:flex;align-items:center;gap:10px;padding:7px 0;position:relative}
.brief li + li::before{content:"";position:absolute;top:0;inset-inline:46px 0;height:.5px;background:var(--sep)}
.brief .tn{flex:1;font-size:16px}
.brief .pts{display:flex;align-items:center;gap:3px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.dream{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;border-radius:18px;background:var(--grouped)}
.dream b{display:block;font-size:15px;font-weight:600}
.dream span{display:block;font-size:13px;color:var(--label-2);margin-top:1px}
.dream.muted{justify-content:center;text-align:center}
/* ready */
.ready{text-align:start}
.ready .burst{margin:0 auto;flex:none}
.ready h1,.ready .sub{text-align:center}
.ready .burst{width:96px;height:96px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;transform:scale(.4);opacity:0;transition:transform .5s var(--spring) .1s, opacity .2s .1s}
.ready .burst svg{width:48px;height:48px}
.ready[data-pos="center"] .burst{transform:none;opacity:1}
.ready h1{margin-top:22px}
.summary{width:100%;margin-top:26px;text-align:start}
.summary .row .t > span{color:var(--label-2)}
.row .t > .minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.minis .glyph.sm{width:24px;height:24px;border-radius:7px}
.minis .glyph.sm svg{width:15px;height:15px}
.goalchip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label-2)}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FFCC00"/><circle cx="12" cy="12" r="11" fill="url(#cg)"/><circle cx="12" cy="12" r="7.6" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/><path d="m12 7.4 1.4 2.9 3.2.5-2.3 2.2.5 3.2-2.8-1.5-2.8 1.5.5-3.2-2.3-2.2 3.2-.5z" fill="#fff"/><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD60A"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient></defs></symbol>
</svg>

<div class="stage">
  <div class="label"><b>الخطوة ٢ · تجهيز المهام</b><nav class="seg" id="steps" aria-label="المراحل"></nav></div>
  <main class="phone" id="phone">
    <div class="chrome" aria-hidden="true">
      <div class="sb"><span>9:41</span><span class="ic">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0z"/><path d="M3.5 7a6.5 6.5 0 0 1 9 0l-1.3 1.3a4.6 4.6 0 0 0-6.4 0z"/><path d="M1.3 4.8a9.6 9.6 0 0 1 13.4 0l-1.3 1.3a7.8 7.8 0 0 0-10.8 0z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" opacity=".4"/></svg></span></div>
      <div class="island"></div><div class="home"></div>
    </div>
    <div id="screens"></div>
    <div class="scrim" id="scrim"></div>
    <div id="sheets"></div>
  </main>
</div>

/* ---------- icons: Lucide (ISC) outlines + two custom glyphs on the same grid ---------- */

  return `${nav(i,at>0)}
    <h1>مهام ${esc(k.name)} اليومية</h1>
    <div class="sub">جهّزنالك مهام حسب عمره (${k.age} ${k.age>10?'سنة':'سنين'}). احذف أو ضيف متل ما بدك.</div>
    <div class="group tlist">${k.tasks.map((t,n)=>`<div class="row" data-row="${t.id}">${glyph(t.icon,t.c,'sm')}<span class="t"><b>${esc(t.name)}</b></span>
      <button class="del" data-remove="${t.id}" aria-label="حذف ${esc(t.name)}">${ic('x',3)}</button></div>`).join('')}
      ${k.tasks.length?'':'<div class="empty">ما في مهام لسا</div>'}
      <button class="row addrow" data-addtasks>${glyph('plus',C.blue,'sm')}إضافة مهمة</button></div>
    <div class="bottom"><button class="btn filled" data-next ${k.tasks.length?'':'disabled'}>التالي</button>
      <div class="hint">${k.tasks.length} مهام · فيك تغيّرهم بعدين</div></div>`;
}
function valuesScreen(i){
  const k=kids[i];
  return `${nav(i)}
    <h1>كل مهمة قديش بتسوى؟</h1>
    <div class="sub">هدول النقاط يلي بتنزل بمكمورة ${esc(k.name)} لما توافق على المهمة.</div>
    <div class="group">${k.tasks.map((t,n)=>`<div class="row">${glyph(t.icon,t.c,'sm')}
      <button class="t" data-days="${n}" style="text-align:start"><b>${esc(t.name)}</b><span>${daysLabel(t.days)}</span></button>
      <span class="stepper"><button data-val="${n}" data-d="-1" aria-label="أقل">${ic('minus',2.6)}</button><span class="v"><input type="number" inputmode="numeric" min="0" max="999" value="${t.value}" data-valin="${n}" aria-label="نقاط ${esc(t.name)}">${coin()}</span><button data-val="${n}" data-d="1" aria-label="أكتر">${ic('plus',2.6)}</button></span></div>`).join('')}</div>
    <div class="total">بيقدر يجمع لحد <b id="perday">${perDay(k)}</b><b>${coin()}</b> باليوم</div>
    <div class="bottom"><button class="btn filled" data-next>التالي</button></div>`;
}
function goalScreen(i){
  const k=kids[i], g=k.goal;
  return `${nav(i)}
    <h1>شو بيحلم ${esc(k.name)}؟</h1>
    <div class="sub">هدف يجمعله. اسأله، وخلّيه يختار معك.</div>
    <div class="goals">${GOALS.map(o=>`<button class="pick" aria-pressed="${g&&g.id===o.id}" data-goal="${o.id}"><span class="ok">${ic('check',3.2)}</span>${glyph(o.icon,o.c)}${o.name}</button>`).join('')}
      <button class="pick new" aria-pressed="${g&&g.id==='custom'}" data-goal="custom"><span class="ok">${ic('check',3.2)}</span>${glyph('plus',C.blue)}شي تاني</button></div>
    ${g?`<div class="namerow"><label for="gname">الهدف</label><input id="gname" value="${esc(g.name)}" placeholder="مثلاً: بلاي ستيشن" data-gname autocomplete="off"><span id="gicon">${glyph(g.icon,g.c,'sm')}</span></div>
      ${g.id==='custom'?`<div class="autonote">${ic('sparkles')}بنختار الأيقونة حسب الاسم</div>`:''}
      <div class="amount"><span class="lbl">بيحتاج يجمع</span>
        <div class="big"><button data-amt="-10" aria-label="أقل">${ic('minus',2.6)}</button><span class="n"><input type="number" inputmode="numeric" min="1" max="99999" value="${g.amount}" id="gamount" aria-label="قديش بيحتاج">${coin()}</span><button data-amt="10" aria-label="أكتر">${ic('plus',2.6)}</button></div>
        <span class="eta" id="eta">${etaText(k)}</span></div>`:''}
    <div class="bottom"><button class="btn filled" data-next ${g&&!g.name.trim()?'disabled':''}>${!g?'تخطّى هلأ':i<kids.length-1?`التالي: ${esc(kids[i+1].name)}`:'خلصنا'}</button>
      ${g?'':'<div class="hint">فيك تحدده بعدين مع '+esc(k.name)+'</div>'}</div>`;
}
function etaText(k){ const d=Math.ceil(k.goal.amount/Math.max(1,perDay(k))); return perDay(k)?`إذا خلّص كل مهامه، بيوصل خلال <b>${d} ${d>2&&d<11?'أيام':'يوم'}</b> تقريباً`:'ما في مهام عليها نقاط لسا'; }
function readyScreen(){
  return `<div style="height:70px;flex:none"></div>
    <div class="burst">${ic('check',3)}</div>
    <h1>كل شي جاهز!</h1>
    <div class="sub">بكرة الصبح بيلاقي كل ولد مهامه ناطرته.</div>
    ${kids.map(k=>{const d=k.goal?Math.ceil(k.goal.amount/Math.max(1,perDay(k))):0;return `<article class="brief">
      <header>${kav(k,'big')}<div><b>${esc(k.name)}</b><span>${k.age} ${k.age>10?'سنة':'سنين'} · ${k.tasks.length} مهام باليوم</span></div></header>
      <ul>${k.tasks.map(t=>`<li>${glyph(t.icon,t.c,'sm')}<span class="tn">${esc(t.name)}</span><span class="pts">${t.value}${coin()}</span></li>`).join('')}</ul>
      ${k.goal?`<div class="dream">${glyph(k.goal.icon,k.goal.c,'sm')}<div><b>بيحلم بـ${esc(k.goal.name||'هدفه')}</b><span>${k.goal.amount} نقطة · تقريباً ${d} ${d>2&&d<11?'أيام':'يوم'}</span></div></div>`
        :`<div class="dream muted"><div><b>لسا ما في حلم</b><span>حدّدوه سوا من الصفحة الرئيسية</span></div></div>`}
    </article>`}).join('')}
    <div class="bottom"><button class="btn filled">للصفحة الرئيسية</button></div>`;
}
function render(dir=1){
  const [kind,i]=FLOW[at];
  const html = kind==='tasks'?tasksScreen(i):kind==='values'?valuesScreen(i):kind==='goal'?goalScreen(i):readyScreen();
  const old=$('#screens .screen');
  const el=document.createElement('section'); el.className='screen'+(kind==='ready'?' ready':''); el.dataset.pos=dir>0?'right':'left'; el.innerHTML=html;
  $('#screens').appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.dataset.pos='center'; if(old){ old.dataset.pos=dir>0?'left':'right'; setTimeout(()=>old.remove(),450) } }));
  steps();
}
/* redraw the current screen in place, keeping scroll */
function refresh(){ const el=$('#screens .screen:last-child'), y=el.scrollTop, [kind,i]=FLOW[at];
  el.innerHTML = kind==='tasks'?tasksScreen(i):kind==='values'?valuesScreen(i):kind==='goal'?goalScreen(i):readyScreen(); el.scrollTop=y; }
function steps(){
  const names={tasks:'المهام',values:'القيمة',goal:'الهدف',ready:'جاهز'};
  $('#steps').innerHTML=FLOW.map(([k,i],n)=>`<button data-jump="${n}" ${n===at?'aria-current="step"':''}>${names[k]}${i!=null?` · ${kids[i].name}`:''}</button>`).join('');
}

/* ---------- sheets ---------- */
function openSheet(html,short){ const cur=$('#sheets .sheet.show'); if(cur){ const y=cur.scrollTop; cur.innerHTML=html; cur.scrollTop=y; return }
  $('#sheets').innerHTML=`<div class="sheet ${short?'short':''}" role="dialog">${html}</div>`; requestAnimationFrame(()=>{ $('#scrim').classList.add('show'); $('#sheets .sheet').classList.add('show') }) }
function closeSheet(){ const s=$('#sheets .sheet'); $('#scrim').classList.remove('show'); if(s){ s.classList.remove('show'); setTimeout(()=>{ if(!s.classList.contains('show')) s.remove() },450) } }

let draft=null, lastAdded=null;
function addSheet(){
  const k=kids[FLOW[at][1]], d=draft, have=new Set(k.tasks.map(t=>t.id));
  const lib=[...SUGGEST,...k.custom];
  openSheet(`<div class="ksbar"><span></span><b>إضافة مهمة</b><button class="done" data-close>تم</button></div>
    <div class="slabel" style="margin-top:4px">مهام جاهزة · كبسة لتضيف</div>
    <div class="grid lib">${lib.map(t=>{const on=have.has(t.id);return `<button class="pick ${lastAdded===t.id?'justadded':''}" aria-pressed="${on}" data-libadd="${t.id}"><span class="ok">${ic('check',3.2)}</span>${glyph(t.icon,t.c)}${esc(t.name)}<span class="state">${on?'انضافت':'&nbsp;'}</span></button>`}).join('')}</div>
    <div class="slabel">أو اكتب مهمة جديدة</div>
    <div class="field" style="margin-top:0"><span class="glyph sm" id="tglyph" style="--c:${TASK};margin-inline-end:12px">${ic(d.icon,2.3)}</span><input id="tname" placeholder="مثلاً: إطعام القطة" value="${esc(d.name)}" autocomplete="off"></div>
    <div class="autonote">${ic('sparkles')}بنختار الأيقونة حسب الاسم</div>
    <button class="btn filled" data-addtask ${d.name.trim()?'':'disabled'}>إضافة «${esc(d.name.trim()||'المهمة')}»</button>`);
}
function daysSheet(n){
  const t=kids[FLOW[at][1]].tasks[n], d=t.days;
  openSheet(`<div class="ksbar"><span></span><b>${esc(t.name)}</b><button class="done" data-close>تم</button></div>
    <div class="slabel" style="margin-top:4px">بأي أيام؟</div>
    <div class="days">${DAYS.map((x,j)=>`<button aria-pressed="${d[j]}" data-day="${j}" data-t="${n}" >${x}</button>`).join('')}</div>
    <div class="presets"><button aria-pressed="${d.every(Boolean)}" data-preset="every" data-t="${n}">كل يوم</button><button aria-pressed="${d.join()===SCHOOL.join()}" data-preset="school" data-t="${n}">أيام المدرسة</button></div>`,true);
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  const [kind,i]=FLOW[at], k=kids[i];
  if(t.dataset.jump!=null){ const n=+t.dataset.jump; const d=n>at?1:-1; at=n; closeSheet(); render(d); return }
  if('next' in t.dataset){ if(t.disabled) return; at=Math.min(FLOW.length-1,at+1); render(1); return }
  if('back' in t.dataset){ at=Math.max(0,at-1); render(-1); return }
  if('close' in t.dataset){ closeSheet(); refresh(); return }
  if(t.dataset.remove){ const row=t.closest('.row'); row.classList.add('leaving'); setTimeout(()=>{ k.tasks=k.tasks.filter(x=>x.id!==t.dataset.remove); refresh() },260); return }
  if('addtasks' in t.dataset){ draft={name:'',icon:'sparkles'}; lastAdded=null; addSheet(); return }
  if(t.dataset.libadd){ const id=t.dataset.libadd, has=k.tasks.some(x=>x.id===id);
    if(has){ k.tasks=k.tasks.filter(x=>x.id!==id); lastAdded=null }
    else { const src=[...SUGGEST,...k.custom].find(x=>x.id===id); k.tasks.push({...src,value:2,days:[...EVERY]}); lastAdded=id }
    addSheet(); return }
  if('addtask' in t.dataset){ if(t.disabled) return; const c={id:'c'+Date.now(),name:draft.name.trim(),icon:taskIconFor(draft.name),c:TASK}; k.custom.push(c); k.tasks.push({...c,value:2,days:[...EVERY]}); draft={name:'',icon:'sparkles'}; addSheet(); return }
  if(t.dataset.val!=null){ const x=k.tasks[+t.dataset.val]; x.value=Math.max(0,Math.min(999,x.value+(+t.dataset.d))); refresh(); return }
  if(t.dataset.days!=null){ daysSheet(+t.dataset.days); return }
  if(t.dataset.day!=null){ const x=k.tasks[+t.dataset.t]; x.days[+t.dataset.day]=!x.days[+t.dataset.day]; if(!x.days.some(Boolean)) x.days[+t.dataset.day]=true; daysSheet(+t.dataset.t); return }
  if(t.dataset.preset){ const x=k.tasks[+t.dataset.t]; x.days=[...(t.dataset.preset==='every'?EVERY:SCHOOL)]; daysSheet(+t.dataset.t); return }
  if(t.dataset.goal){ if(t.dataset.goal==='custom'){ k.goal={id:'custom',name:'',icon:'gift',c:GOAL,amount:100}; refresh(); setTimeout(()=>$('#gname')&&$('#gname').focus(),50) } else { k.goal={...GOALS.find(g=>g.id===t.dataset.goal)}; refresh() } return }
  if(t.dataset.amt){ k.goal.amount=Math.max(1,Math.min(99999,k.goal.amount+(+t.dataset.amt))); refresh(); return }
});
document.addEventListener('input',e=>{
  const el=e.target, k=kids[FLOW[at][1]];
  if(el.id==='tname'){ draft.name=el.value; draft.icon=taskIconFor(el.value); const tg=$('#tglyph'); if(tg) tg.innerHTML=ic(draft.icon,2.3); const b=document.querySelector('[data-addtask]'); if(b){ b.disabled=!draft.name.trim(); b.textContent=`إضافة «${draft.name.trim()||'المهمة'}»` } }
  if(el.dataset.valin!=null){ const v=parseInt(el.value,10); k.tasks[+el.dataset.valin].value=isNaN(v)?0:Math.max(0,Math.min(999,v)); $('#perday').textContent=perDay(k) }
  if(el.dataset.gname!=null){ k.goal.name=el.value;
    if(k.goal.id==='custom'){ Object.assign(k.goal,iconFor(el.value)); $('#gicon').innerHTML=glyph(k.goal.icon,k.goal.c,'sm') }
    const nb=document.querySelector('[data-next]'); if(nb) nb.disabled=!el.value.trim() }
  if(el.id==='gamount'){ const v=parseInt(el.value,10); k.goal.amount=isNaN(v)||v<1?1:Math.min(99999,v); $('#eta').innerHTML=etaText(k) }
});
/* clean up a typed number when leaving the field */
document.addEventListener('focusout',e=>{ const el=e.target, k=kids[FLOW[at][1]]; if(!k) return;
  if(el.dataset.valin!=null) el.value=k.tasks[+el.dataset.valin].value;
  if(el.id==='gamount') el.value=k.goal.amount; });
$('#scrim').addEventListener('click',()=>{ closeSheet(); if(FLOW[at][0]==='values') refresh() });
render(1);
</script>
</body>
</html>
