<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makmoura Parent Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Same native iOS system and one-colour identity as screens 1 and 2. */
:root{
  color-scheme: light;
  --grouped:#F2F2F7; --label:#000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --blue:#007AFF; --tint:#E6F1FF; --green:#34C759;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --glass:rgba(255,255,255,.72);
  --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.64,1); --push:cubic-bezier(.32,.72,0,1);
}
html,body{direction:rtl}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#E5E5EA;color:var(--label);font-family:var(--font);-webkit-font-smoothing:antialiased;padding-inline:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid rgba(0,122,255,.5);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none}

/* desktop preview */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:24px}
.label{font-size:17px;font-weight:600}
.phone{position:relative;width:390px;height:min(844px, calc(100dvh - 90px));min-height:660px;border-radius:55px;overflow:hidden;background:var(--grouped);
  box-shadow:0 0 0 12px #1C1C1E, 0 0 0 13px #3A3A3C, 0 30px 80px rgba(0,0,0,.25)}
.chrome{position:absolute;inset:0;pointer-events:none;z-index:60}
.sb{position:absolute;top:0;inset-inline:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0;font:600 17px/1 "Inter",-apple-system,sans-serif;color:#000}
.sb .ic{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:#000}
@media (max-width: 520px){
  body{padding-inline:0;background:var(--grouped)}
  .stage{padding-block:0;gap:0}
  .label,.chrome{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:560px;border-radius:0;box-shadow:none}
}

.scroll{position:absolute;inset:0;overflow-y:auto;padding:58px 20px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top small{display:block;font-size:15px;color:var(--label-2)}
.top h1{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:-.01em}
.me{width:44px;height:44px;border-radius:50%;background:var(--tint);overflow:hidden;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px #fff}
.me img{width:84%;margin-top:10%}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 10px}
.sec h2{margin:0;font-size:22px;font-weight:700}
.sec .count{min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--blue);color:#fff;display:inline-grid;place-items:center;font-size:14px;font-weight:700;margin-inline-start:8px;vertical-align:3px}
.sec .all{color:var(--blue);font-size:15px;font-weight:600}

/* app-style icon tile */
.glyph{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#3D9BFF,#0066E6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 3px 8px -3px rgba(0,102,230,.5);flex:none}
.glyph svg{width:23px;height:23px}
.kav{border-radius:50%;background:var(--tint);overflow:hidden;display:grid;place-items:center;flex:none}
.kav img{width:84%;height:84%;object-fit:contain;margin-top:8%}
.riyal{width:.9em;height:.9em;vertical-align:-.1em;display:inline-block}

/* waiting for approval */
.pending{display:flex;flex-direction:column;gap:10px}
.req{background:#fff;border-radius:26px;padding:14px;transition:transform .35s var(--out), opacity .3s, margin .35s var(--out), max-height .35s var(--out);max-height:200px;overflow:hidden}
.req.leave{opacity:0;transform:translateX(-40px) scale(.96);max-height:0;padding-block:0;margin-top:-10px}
.req .r1{display:flex;align-items:center;gap:12px}
.req .who{position:relative;flex:none}
.req .who .kav{width:48px;height:48px}
.req .who .glyph{position:absolute;bottom:-4px;left:-6px;width:26px;height:26px;border-radius:8px;box-shadow:0 0 0 2px #fff}
.req .who .glyph svg{width:15px;height:15px}
.req .t{flex:1;min-width:0}
.req .t b{display:block;font-size:17px;font-weight:600}
.req .t span{display:block;font-size:13px;color:var(--label-2);margin-top:2px}
.req .amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.req .r2{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}
.btn{height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:600;transition:transform .35s var(--spring), background .2s}
.btn:active{transform:scale(.95)}
.btn svg{width:18px;height:18px}
.btn.ok{background:var(--blue);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 12px -5px rgba(0,122,255,.6)}
.btn.back{background:rgba(118,118,128,.12);color:var(--label)}
.btn.big{height:54px;font-size:17px;width:100%}
.calm{background:#fff;border-radius:26px;padding:22px 16px;display:flex;align-items:center;gap:14px}
.calm .c{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.calm .c svg{width:26px;height:26px}
.calm b{display:block;font-size:17px;font-weight:600}
.calm span{display:block;font-size:14px;color:var(--label-2);margin-top:2px}

/* children today */
.kids{background:#fff;border-radius:26px;overflow:hidden}
.kid{display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative;width:100%;text-align:start}
.kid + .kid::before{content:"";position:absolute;top:0;inset-inline:80px 0;height:.5px;background:var(--sep)}
.kid .ring{position:relative;width:56px;height:56px;flex:none}
.kid .ring svg{position:absolute;inset:0;transform:scaleX(-1) rotate(-90deg)}
.kid .ring .kav{position:absolute;inset:6px}
.kid .t{flex:1;min-width:0}
.kid .t b{display:block;font-size:17px;font-weight:600}
.kid .t .line{display:block;font-size:13px;color:var(--label-2);margin-top:2px}
.kid .goal{display:flex;align-items:center;gap:8px;margin-top:8px}
.kid .goal .bar{flex:1;height:6px;border-radius:99px;background:rgba(118,118,128,.16);overflow:hidden}
.kid .goal .bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .8s var(--out)}
.kid .goal span{font-size:12px;color:var(--label-2);white-space:nowrap}
.kid .chev{color:var(--label-3)}
.kid .chev svg{width:18px;height:18px;transform:scaleX(-1)}
.kid.bump .ring{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.08)}}

/* family surprise */
.surprise{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:26px;padding:14px 16px;text-align:start}
.surprise .t{flex:1}
.surprise b{display:block;font-size:17px;font-weight:600}
.surprise span{display:block;font-size:13px;color:var(--label-2);margin-top:2px}
.surprise .chev{color:var(--label-3)}
.surprise .chev svg{width:18px;height:18px;transform:scaleX(-1)}

/* floating glass tab bar (iOS 26) */
.tabbar{position:absolute;bottom:22px;inset-inline:20px;height:64px;border-radius:99px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;z-index:10;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08), inset 0 1px 0 #fff, 0 8px 30px rgba(0,0,0,.12)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--label-2)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--blue)}
@media (max-width:520px){.tabbar{bottom:calc(14px + env(safe-area-inset-bottom,0px))}}

/* sheets, Face ID, toast */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:8px;bottom:8px;background:#fff;border-radius:40px;padding:26px 22px 24px;z-index:21;transform:translateY(110%);transition:transform .45s var(--push);text-align:center}
.sheet.show{transform:none}
.sheet .lock{width:64px;height:64px;border-radius:18px;margin:0 auto;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#3D9BFF,#0066E6)}
.sheet .lock svg{width:32px;height:32px}
.sheet h3{margin:16px 0 0;font-size:22px;font-weight:700}
.sheet p{margin:8px 8px 0;font-size:15px;color:var(--label-2);line-height:1.55}
.sheet .btn{margin-top:18px}
.sheet .textbtn{margin-top:10px;color:var(--blue);font-size:16px;padding:8px}
.faceid{position:absolute;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
.faceid.show{opacity:1}
.faceid .box{width:150px;height:150px;border-radius:34px;background:rgba(242,242,247,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:15px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.faceid svg{width:64px;height:64px;color:#000}
.faceid.ok svg{color:var(--green)}
.toast{position:absolute;top:62px;left:50%;transform:translate(-50%,-14px);background:rgba(28,28,30,.92);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;opacity:0;transition:all .35s var(--out);z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;color:var(--green)}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>

IC.mosque='<path d="M3 21h18"/><path d="M6 21v-6h12v6"/><path d="M6 15a6 6 0 0 1 12 0"/><path d="M12 9V6.5"/><path d="M12 4.5v.01"/><path d="M10.5 21v-2.5a1.5 1.5 0 0 1 3 0V21"/>';
IC.check='<path d="M20 6 9 17l-5-5"/>'; IC.chev='<path d="m9 18 6-6-6-6"/>';
const ic=(n,w=2.4)=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const glyph=n=>`<span class="glyph">${ic(n)}</span>`;
/* official Saudi riyal sign (Saudi-Riyal-Font, SIL OFL 1.1) */
const RIYAL=`<svg class="riyal" viewBox="0 0 1256 1256" role="img" aria-label="ريال"><path fill="currentColor" d="M0,0M750,1119 C730,1163,716,1211,711,1262 C711,1262,1136,1172,1136,1172 C1156,1127,1169,1079,1174,1028 C1174,1028,750,1119,750,1119Z M1136,901 C1136,901,1136,901,1136,901 C1156,857,1169,809,1174,758 C1174,758,843,828,843,828 C843,828,843,693,843,693 C843,693,1136,631,1136,631 C1156,587,1169,538,1174,488 C1174,488,843,558,843,558 C843,558,843,72,843,72 C793,100,748,138,711,183 C711,183,711,586,711,586 C711,586,579,614,579,614 C579,614,579,6,579,6 C528,34,483,72,447,117 C447,117,447,642,447,642 C447,642,151,705,151,705 C131,750,117,798,112,849 C112,849,447,777,447,777 C447,777,447,948,447,948 C447,948,88,1024,88,1024 C68,1068,55,1117,50,1167 C50,1167,425,1088,425,1088 C456,1081,482,1063,499,1038 C499,1038,568,936,568,936 C568,936,568,936,568,936 C575,926,579,913,579,899 C579,899,579,749,579,749 C579,749,711,721,711,721 C711,721,711,992,711,992 C711,992,1136,901,1136,901Z "/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const $=s=>document.querySelector(s);

/* how a finished task reads, as a sentence about the child */
const TASKS={
  teeth:{icon:'toothbrush',did:'فرّش سنانه'}, bed:{icon:'bed',did:'رتّب سريره'}, pray:{icon:'mosque',did:'صلّى الضهر'},
  read:{icon:'book-open',did:'قرأ ربع ساعة'}, bag:{icon:'backpack',did:'جهّز شنطته'}, hw:{icon:'pencil',did:'خلّص وظايفه'},
  toys:{icon:'toy-brick',did:'رتّب ألعابه'}, water:{icon:'droplets',did:'شرب مي'}, dress:{icon:'shirt',did:'لبس لحاله'},
};
/* the family set up in step 2 (demo) */
const kids=[
  {name:'سليم', photo:'../photos/boy.png', goal:{name:'بلاي ستيشن',icon:'gamepad-2',amount:300}, saved:112,
   tasks:[['teeth',2,'done'],['bed',2,'wait','قبل 10 دقايق'],['pray',3,'wait','قبل 25 دقيقة'],['read',2,'todo'],['bag',2,'todo'],['hw',3,'todo']]},
  {name:'لؤي', photo:'../photos/child.png', goal:{name:'علبة ألوان',icon:'palette',amount:40}, saved:26,
   tasks:[['teeth',2,'done'],['bed',2,'done'],['toys',2,'wait','قبل 5 دقايق'],['water',2,'todo'],['dress',2,'todo']]},
];
let secured=false;   // the parent passcode / Face ID is asked at the first approval, not at sign-up

const kav=(k,sz)=>`<span class="kav" style="width:${sz}px;height:${sz}px"><img src="${k.photo}" alt=""></span>`;
const money=n=>`${n} ${RIYAL}`;
const today=new Intl.DateTimeFormat('ar',{weekday:'long',day:'numeric',month:'long',numberingSystem:'latn'}).format(new Date());

function ring(k){
  const done=k.tasks.filter(t=>t[2]==='done').length, n=k.tasks.length, r=24, C=2*Math.PI*r, off=C*(1-done/n);
  return `<span class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="${r}" fill="none" stroke="rgba(118,118,128,.16)" stroke-width="4"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${done===n?'var(--green)':'var(--blue)'}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .8s var(--out)"/></svg>${kav(k,44)}</span>`;
}
function render(){
  const pend=[]; kids.forEach((k,i)=>k.tasks.forEach((t,j)=>{ if(t[2]==='wait') pend.push({i,j}) }));
  $('#scroll').innerHTML=`
    <header class="top"><div><small>${today}</small><h1>اليوم</h1></div><button class="me" aria-label="حسابي"><img src="../photos/man.png" alt=""></button></header>

    <div class="sec"><h2>بانتظار موافقتك${pend.length?`<span class="count">${pend.length}</span>`:''}</h2>${pend.length>1?`<button class="all" data-all>وافق على الكل</button>`:''}</div>
    ${pend.length?`<div class="pending">${pend.map(({i,j})=>{const k=kids[i],t=k.tasks[j],T=TASKS[t[0]];return `
      <article class="req" data-req="${i}-${j}">
        <div class="r1"><span class="who">${kav(k,48)}${glyph(T.icon)}</span>
          <div class="t"><b>${esc(k.name)} ${T.did}</b><span>${t[3]||''}</span></div>
          <span class="amt">${money(t[1])}</span></div>
        <div class="r2"><button class="btn back" data-redo="${i}-${j}">${ic('rotate-ccw')}رجّعها</button><button class="btn ok" data-ok="${i}-${j}">${ic('check',3)}موافقة</button></div>
      </article>`}).join('')}</div>`
    :`<div class="calm"><span class="c">${ic('check',3)}</span><div><b>ما في شي بانتظارك</b><span>لما يخلّص حدا مهمة، بتوصلك هون.</span></div></div>`}

    <div class="sec"><h2>الأولاد اليوم</h2></div>
    <div class="kids">${kids.map(k=>{const done=k.tasks.filter(t=>t[2]==='done'), earned=done.reduce((a,t)=>a+t[1],0), pct=Math.min(100,k.saved/k.goal.amount*100);return `
      <button class="kid" data-kid="${esc(k.name)}">${ring(k)}
        <span class="t"><b>${esc(k.name)}</b><span class="line">${done.length} من ${k.tasks.length} مهام · جمع اليوم ${money(earned)}</span>
          <span class="goal"><span class="bar"><i style="width:${pct}%"></i></span><span>${esc(k.goal.name)} · ${k.saved} من ${money(k.goal.amount)}</span></span></span>
        <span class="chev">${ic('chev')}</span></button>`}).join('')}</div>

    <div class="sec"><h2>مفاجأة للعيلة</h2></div>
    <button class="surprise" data-soon>${glyph('gift')}<span class="t"><b>جهّز مفاجأة</b><span>بيتزا، طلعة، ليلة أفلام… لما يخلّصوا كلهم مهامهم</span></span><span class="chev">${ic('chev')}</span></button>`;
}
function tabs(){
  $('#tabbar').innerHTML=[['house','اليوم',true],['users','الأولاد'],['settings','الإعدادات']].map(([i,l,on])=>`<button role="tab" aria-selected="${!!on}" ${on?'':'data-soon'}>${ic(i,2.2)}${l}</button>`).join('');
}
function toast(html){ const t=$('#toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1900) }

/* Face ID once per session; the first time, explain why */
function faceId(then){
  const f=$('#faceid'); f.classList.remove('ok'); $('#fidText').textContent='Face ID'; f.classList.add('show');
  setTimeout(()=>{ f.classList.add('ok'); $('#fidText').textContent='تم'; },650);
  setTimeout(()=>{ f.classList.remove('show'); then() },1050);
}
let queued=null;
function guard(action){
  if(secured) return action();
  queued=action; $('#scrim').classList.add('show'); $('#sheet').classList.add('show');
}
function approve(keys){
  const cards=keys.map(k=>document.querySelector(`[data-req="${k}"]`)).filter(Boolean);
  cards.forEach(c=>c.classList.add('leave'));
  const names=new Set(); let total=0;
  keys.forEach(key=>{ const [i,j]=key.split('-').map(Number), k=kids[i], t=k.tasks[j]; t[2]='done'; k.saved+=t[1]; total+=t[1]; names.add(k.name) });
  setTimeout(()=>{ render(); names.forEach(n=>{ const el=document.querySelector(`[data-kid="${n}"]`); el&&el.classList.add('bump') }) },330);
  toast(`${ic('check',3)}${keys.length>1?`وافقت على ${keys.length} مهام · ${money(total)}`:`انضافوا ${money(total)} لمكمورة ${[...names][0]}`}`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.ok){ guard(()=>approve([b.dataset.ok])); return }
  if('all' in b.dataset){ const keys=[...document.querySelectorAll('[data-req]')].map(x=>x.dataset.req); guard(()=>approve(keys)); return }
  if(b.dataset.redo){ const [i,j]=b.dataset.redo.split('-').map(Number), k=kids[i]; k.tasks[j][2]='todo';
    const c=document.querySelector(`[data-req="${b.dataset.redo}"]`); c.classList.add('leave'); setTimeout(render,330);
    toast(`${ic('rotate-ccw')}رجعت المهمة لـ${k.name} ليعيدها`); return }
  if('enable' in b.dataset){ $('#sheet').classList.remove('show'); $('#scrim').classList.remove('show'); secured=true; const a=queued; queued=null; setTimeout(()=>faceId(a),350); return }
  if('soon' in b.dataset){ toast('قريباً'); return }
});
$('#scrim').addEventListener('click',()=>{ $('#sheet').classList.remove('show'); $('#scrim').classList.remove('show'); queued=null });
tabs(); render();
</script>
</body>
</html>
